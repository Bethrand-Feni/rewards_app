[project]
name = "sibling-rewards-api"
version = "0.1.0"
description = "FastAPI backend for Sibling Rewards on Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1"
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "workers-py"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

